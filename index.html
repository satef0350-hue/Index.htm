
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ميزانيتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F1E6;
    --card:#FBF8F0;
    --card-warm:#F1E9D8;
    --green:#1D4A3C;
    --green-deep:#153A2F;
    --gold:#E8A93C;
    --gold-soft:#F4D89A;
    --red:#C4633D;
    --ink:#1D4A3C;
    --muted:#7C8A83;
    --line:#E7DFCC;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:92px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 18px 8px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .topbar h1{font-size:20px;font-weight:800;margin:0;}
  .topbar .sub{font-size:12px;color:var(--muted);font-weight:500;}
  .iconbtn{
    width:42px;height:42px;border-radius:50%;
    background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .iconbtn svg{width:18px;height:18px;stroke:var(--green);}

  .hero{
    background:linear-gradient(160deg,var(--green) 0%, var(--green-deep) 100%);
    border-radius:26px;
    padding:26px 22px;
    color:#fff;
    position:relative;
    overflow:hidden;
    margin-bottom:16px;
  }
  .hero::before{
    content:"";position:absolute;left:-40px;top:-60px;width:200px;height:200px;
    border-radius:50%;border:1.5px solid rgba(255,255,255,.12);
  }
  .hero::after{
    content:"";position:absolute;right:-60px;bottom:-70px;width:220px;height:220px;
    border-radius:50%;border:1.5px solid rgba(255,255,255,.10);
  }
  .hero .label{font-size:13px;opacity:.75;font-weight:500;position:relative;}
  .hero .big{font-size:38px;font-weight:900;margin:10px 0 18px;position:relative;letter-spacing:-.5px;}
  .hero .row{display:flex;gap:14px;position:relative;}
  .hero .col{flex:1;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;}
  .hero .col .k{font-size:11px;opacity:.7;margin-bottom:4px;}
  .hero .col .v{font-size:16px;font-weight:800;}
  .plus{color:var(--gold);}
  .minus{color:#E9A98A;}

  .card{
    background:var(--card);
    border-radius:22px;
    padding:20px;
    margin-bottom:16px;
    border:1px solid var(--line);
  }
  .card h2{font-size:16px;font-weight:800;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  
  .comparison-box {
    background: var(--card-warm);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 700;
    color: var(--green-deep);
    margin-bottom: 12px;
    line-height: 1.6;
    border-right: 4px solid var(--gold);
  }
  
  .barwrap{background:var(--card-warm);border-radius:20px;height:12px;overflow:hidden;margin:10px 0;display:flex;}
  .bar-seg{height:100%;transition:width .4s;}
  .barlabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:500;}
  .pct{font-size:26px;font-weight:800;color:var(--gold);}
  .pct.over{color:var(--red);}

  .catrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .catrow:last-child{border-bottom:none;}
  .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .catname{flex:1;font-size:14px;font-weight:700;}
  .catamt{font-size:14px;font-weight:800;}
  .catpct{font-size:12px;color:var(--muted);width:34px;text-align:left;}

  .txrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .txrow:last-child{border-bottom:none;}
  .txicon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--card-warm);}
  .txicon.income{background:#DCEAE3;}
  .txbody{flex:1;min-width:0;}
  .txname{font-size:14px;font-weight:700;}
  .txmeta{font-size:11px;color:var(--muted);margin-top:2px;}
  .txamt{font-size:14px;font-weight:800;white-space:nowrap;}
  .txdel{width:26px;height:26px;border-radius:50%;background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer;}

  .empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:13px;line-height:1.9;}

  .fab{
    position:fixed;left:50%;transform:translateX(-50%);bottom:88px;
    background:var(--green);color:#fff;border:none;border-radius:30px;
    padding:14px 26px;font-size:15px;font-weight:800;font-family:inherit;
    box-shadow:0 10px 24px rgba(29,74,60,.35);
    display:flex;align-items:center;gap:8px;cursor:pointer;z-index:40;
  }

  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--card);border-top:1px solid var(--line);
    display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:30;
  }
  nav.tabbar button{
    flex:1;background:none;border:none;font-family:inherit;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--muted);font-size:11px;font-weight:700;padding:6px 2px;cursor:pointer;
  }
  nav.tabbar button.active{color:var(--green);}
  nav.tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}

  .page{display:none;}
  .page.active{display:block;}

  .overlay{
    position:fixed;inset:0;background:rgba(21,58,47,.45);
    display:none;align-items:flex-end;justify-content:center;z-index:100;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--cream);width:100%;max-width:520px;
    border-radius:26px 26px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
    animation:up .25s ease;
  }
  @keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h3{font-size:18px;font-weight:800;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px;}
  .field input, .field select{
    width:100%;border:1.5px solid var(--line);background:var(--card);
    border-radius:14px;padding:13px 14px;font-size:15px;font-family:inherit;
    color:var(--ink);font-weight:700;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--gold);}
  .chipwrap{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:1.5px solid var(--line);background:var(--card);border-radius:20px;
    padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink);
  }
  .chip.sel{background:var(--green);border-color:var(--green);color:#fff;}
  .btn{
    width:100%;background:var(--green);color:#fff;border:none;border-radius:16px;
    padding:15px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:6px;
  }
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
  .btn.danger{background:var(--red);}
  .rowline{display:flex;gap:10px;}
  .rowline>*{flex:1;}
  .smalllink{text-align:center;font-size:12px;color:var(--muted);font-weight:700;margin-top:14px;cursor:pointer;text-decoration:underline;}

  .archiveitem{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px;margin-bottom:12px;cursor:pointer;
  }
  .archiveitem .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .archiveitem .top b{font-size:15px;}
  .archiveitem .stats{display:flex;gap:16px;font-size:12px;color:var(--muted);font-weight:600;}
  .toast{
    position:fixed;bottom:150px;left:50%;transform:translateX(-50%);
    background:var(--green-deep);color:#fff;padding:11px 20px;border-radius:14px;
    font-size:13px;font-weight:700;z-index:200;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-8px);}
  .loading{text-align:center;padding:60px 0;color:var(--muted);font-size:13px;}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="loading" id="loadingMsg">جاري التحقق من الحساب...</div>
</div>

<button class="fab" id="fabAdd" style="display:none;">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
  إضافة عملية
</button>

<nav class="tabbar" id="tabbar" style="display:none;">
  <button data-tab="home" class="active">
    <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    الرئيسية
  </button>
  <button data-tab="tx">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    العمليات
  </button>
  <button data-tab="archive">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg>
    الأرشيف
  </button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
    الإعدادات
  </button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheetContent"></div></div>
<div class="toast" id="toast"></div>

<script>
const DEFAULT_CATEGORIES = [
  {id:'beauty', name:'تجميل', color:'#D98BB0'},
  {id:'meds', name:'أدوية', color:'#7CA6D9'},
  {id:'transport', name:'مواصلات', color:'#7FC9A6'},
  {id:'gam3iya', name:'جمعيات', color:'#C4633D'},
  {id:'devices', name:'أجهزة', color:'#8E7CD9'},
  {id:'installments', name:'تقسيط', color:'#E8A93C'},
  {id:'courses', name:'كورسات', color:'#4FA8A0'},
  {id:'home', name:'مشتريات للبيت', color:'#1D4A3C'},
  {id:'other', name:'أخرى', color:'#9A8C6E'},
];
const DEFAULT_ACCOUNTS = [
  {id:'cash', name:'نقدي', initialBalance: 0},
];

let currentUser = null;
let state = {
  salary: 0,
  accounts: DEFAULT_ACCOUNTS,
  categories: DEFAULT_CATEGORIES,
  expenses: [],
  monthLabel: '',
};
let archiveIndex = [];

const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function fmt(n){
  n = Math.round(Number(n)||0);
  return n.toLocaleString('en-US');
}
function currentMonthLabel(){
  const d = new Date();
  return MONTHS_AR[d.getMonth()] + ' ' + d.getFullYear();
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

// مراقبة حالة تسجيل الدخول
window.addEventListener('DOMContentLoaded', () => {
  const checkAuthInterval = setInterval(() => {
    if(window.auth && window.onAuthStateChanged) {
      clearInterval(checkAuthInterval);
      window.onAuthStateChanged(window.auth, async (user) => {
        if(user){
          currentUser = user;
          await loadState();
          render();
        } else {
          currentUser = null;
          renderAuthScreen();
        }
      });
    }
  }, 100);
});

function renderAuthScreen(){
  document.getElementById('fabAdd').style.display = 'none';
  document.getElementById('tabbar').style.display = 'none';
  document.getElementById('app').innerHTML = `
    <div class="card" style="margin-top:40px; text-align:center;">
      <h2>ميزانيتي الشخصية</h2>
      <p style="font-size:13px; color:var(--muted); margin-bottom:20px;">الرجاء تسجيل الدخول أو إنشاء حساب جديد للوصول لميزانيتك الخاصة.</p>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" id="authEmail" placeholder="name@example.com"></div>
      <div class="field"><label>كلمة المرور</label><input type="password" id="authPassword" placeholder="••••••••"></div>
      <button class="btn" id="btnLogin">تسجيل الدخول</button>
      <button class="btn ghost" id="btnRegister" style="margin-top:10px;">إنشاء حساب جديد</button>
    </div>
  `;

  document.getElementById('btnLogin').addEventListener('click', async () => {
    const email = document.getElementById('authEmail').value.trim();
    const pass = document.getElementById('authPassword').value.trim();
    if(!email || !pass){ showToast('املأ جميع الحقول'); return; }
    try{
      await window.signInWithEmailAndPassword(window.auth, email, pass);
      showToast('تم تسجيل الدخول بنجاح');
    }catch(e){
      showToast('خطأ في البيانات، تأكد منها');
    }
  });

  document.getElementById('btnRegister').addEventListener('click', async () => {
    const email = document.getElementById('authEmail').value.trim();
    const pass = document.getElementById('authPassword').value.trim();
    if(!email || !pass){ showToast('املأ جميع الحقول'); return; }
    try{
      await window.createUserWithEmailAndPassword(window.auth, email, pass);
      showToast('تم إنشاء الحساب بنجاح');
    }catch(e){
      showToast('خطأ في إنشاء الحساب (كلمة المرور ضعيفة أو الإيميل مستخدم)');
    }
  });
}

async function loadState(){
  try{
    state.monthLabel = currentMonthLabel();
    if(window.db && currentUser){
      const { getDocs, collection, doc, getDoc } = await import("https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js");
      
      const uidPath = currentUser.uid;

      // جلب العمليات الخاصة بالمستخدم فقط
      const expSnap = await getDocs(collection(window.db, "users", uidPath, "expenses"));
      state.expenses = [];
      expSnap.forEach(d => {
        state.expenses.push({ firestoreId: d.id, ...d.data() });
      });

      // جلب إعدادات المستخدم
      const settingsSnap = await getDocs(collection(window.db, "users", uidPath, "settings"));
      settingsSnap.forEach(d => {
        if(d.id === 'salary') state.salary = d.data().value || 0;
        if(d.id === 'accounts' && d.data().list) state.accounts = d.data().list;
        if(d.id === 'categories' && d.data().list) state.categories = d.data().list;
      });

      // جلب أرشيف المستخدم
      const archSnap = await getDocs(collection(window.db, "users", uidPath, "archiveIndex"));
      archiveIndex = [];
      archSnap.forEach(d => {
        archiveIndex.push(d.data());
      });
    }
  }catch(e){
    console.error('load failed', e);
  }
}

async function saveAccountsToFirebase(){
  try{
    const { setDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js");
    await setDoc(doc(window.db, "users", currentUser.uid, "settings", "accounts"), { list: state.accounts });
  }catch(e){console.error(e);}
}

async function saveCategoriesToFirebase(){
  try{
    const { setDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js");
    await setDoc(doc(window.db, "users", currentUser.uid, "settings", "categories"), { list: state.categories });
  }catch(e){console.error(e);}
}

function totalExpenses(){
  return state.expenses.filter(e=>e.type==='expense').reduce((s,e)=>s+Number(e.amount),0);
}
function totalIncomeExtra(){
  return state.expenses.filter(e=>e.type==='income').reduce((s,e)=>s+Number(e.amount),0);
}
function totalBudget(){
  return Number(state.salary||0) + totalIncomeExtra();
}
function remaining(){
  return totalBudget() - totalExpenses();
}
function pctUsed(){
  const b = totalBudget();
  if(b<=0) return 0;
  return Math.min(999, Math.round((totalExpenses()/b)*100));
}
function categoryTotals(){
  const map = {};
  state.categories.forEach(c=>map[c.id]={...c, amount:0});
  state.expenses.filter(e=>e.type==='expense').forEach(e=>{
    if(!map[e.category]) map[e.category] = {id:e.category, name:e.categoryName||'أخرى', color:'#9A8C6E', amount:0};
    map[e.category].amount += Number(e.amount);
  });
  return Object.values(map).filter(c=>c.amount>0).sort((a,b)=>b.amount-a.amount);
}

let activeTab = 'home';

function render(){
  if(!currentUser) return;
  const app = document.getElementById('app');
  document.getElementById('fabAdd').style.display = 'flex';
  document.getElementById('tabbar').style.display = 'flex';

  let html = `
    <div class="topbar">
      <div>
        <h1>ميزانيتي</h1>
        <div class="sub">${state.monthLabel}</div>
      </div>
      <div style="display:flex;gap:8px;">
        <div class="iconbtn" id="btnLogout" title="تسجيل الخروج">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </div>
        <div class="iconbtn" id="btnEndMonth" title="إنهاء الشهر">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M10 13h4"/></svg>
        </div>
      </div>
    </div>
  `;

  if(activeTab==='home') html += renderHome();
  else if(activeTab==='tx') html += renderTx();
  else if(activeTab==='archive') html += renderArchive();
  else if(activeTab==='settings') html += renderSettings();

  app.innerHTML = html;
  attachHomeEvents();
}

function renderHome(){
  const used = pctUsed();
  const over = used > 100;
  const cats = categoryTotals();
  const budget = totalBudget();

  let catsHtml = '';
  let comparisonText = 'لا توجد مصروفات مسجلة للمقارنة حالياً.';

  if(cats.length === 0){
    catsHtml = `<div class="empty">لسه معملتش أي عملية الشهر ده.<br>اضغط "إضافة عملية" وابدأ تسجّل مصاريفك.</div>`;
  } else {
    if(cats.length === 1){
      comparisonText = `المصروف بالكامل متركز حالياً في فئة <strong>${cats[0].name}</strong> بنسبة 100%.`;
    } else {
      const highest = cats[0];
      const othersText = cats.slice(1).map(c => `${c.name} (${fmt(c.amount)} ج.م)`).join('، و');
      comparisonText = `📈 الفئة الأعلى في الصرف هي <strong>${highest.name}</strong> (${fmt(highest.amount)} ج.م)، وهي أعلى من باقي الفئات: ${othersText}.`;
    }

    catsHtml = cats.map(c=>{
      const p = budget>0 ? Math.round((c.amount/budget)*100) : 0;
      return `
      <div class="catrow">
        <div class="dot" style="background:${c.color}"></div>
        <div class="catname">${c.name}</div>
        <div class="catamt">${fmt(c.amount)} <span style="font-size:11px;color:var(--muted);font-weight:600;">ج.م</span></div>
        <div class="catpct">${p}%</div>
      </div>`;
    }).join('');
  }

  let barSegmentsHtml = '';
  const totalExp = totalExpenses();
  if(totalExp > 0){
    cats.forEach(c => {
      const sharePct = (c.amount / totalExp) * 100;
      barSegmentsHtml += `<div class="bar-seg" style="width:${sharePct}%; background:${c.color};" title="${c.name}: ${fmt(c.amount)} ج.م"></div>`;
    });
  } else {
    barSegmentsHtml = `<div class="bar-seg" style="width:100%; background:var(--line);"></div>`;
  }

  return `
    <div class="hero">
      <div class="label">الرصيد المتبقي من ${fmt(budget)} ج.م</div>
      <div class="big">${fmt(remaining())} ج.م</div>
      <div class="row">
        <div class="col"><div class="k">المرتب الشهري</div><div class="v plus">${fmt(state.salary)}</div></div>
        <div class="col"><div class="k">إجمالي المصروف</div><div class="v minus">${fmt(totalExpenses())}</div></div>
      </div>
    </div>

    <div class="card">
      <h2>نسبة الاستخدام من الميزانية</h2>
      <div class="pct ${over?'over':''}">${used}%</div>
      <div class="barwrap">${barSegmentsHtml}</div>
      <div class="barlabels"><span>بداية الشهر</span><span>نهاية الشهر</span></div>
    </div>

    <div class="card">
      <h2>إلى أين تذهب أموالك؟</h2>
      <div class="comparison-box">${comparisonText}</div>
      ${catsHtml}
    </div>
  `;
}

function renderTx(){
  const list = [...state.expenses].sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.id||'').localeCompare(a.id||''));
  let rows = '';
  if(list.length===0){
    rows = `<div class="empty">مفيش عمليات مسجّلة لسه.</div>`;
  } else {
    rows = list.map(e=>{
      const isIncome = e.type==='income';
      const acc = state.accounts.find(a=>a.id===e.account);
      return `
      <div class="txrow">
        <div class="txicon ${isIncome?'income':''}">${isIncome?'💰':catIcon(e.category)}</div>
        <div class="txbody">
          <div class="txname">${e.note || e.categoryName}</div>
          <div class="txmeta">${e.categoryName}${acc?' · '+acc.name:''}${e.date?' · '+e.date:''}</div>
        </div>
        <div class="txamt ${isIncome?'plus':'minus'}">${isIncome?'+':'-'} ${fmt(e.amount)}</div>
        <button class="txdel" data-del="${e.firestoreId || e.id}">✕</button>
      </div>`;
    }).join('');
  }
  return `<div class="card"><h2>كل العمليات (${list.length})</h2>${rows}</div>`;
}

function catIcon(catId){
  const icons = {beauty:'💄',meds:'💊',transport:'🚌',gam3iya:'🤝',devices:'📱',installments:'🧾',courses:'🎓',home:'🏠',other:'📌'};
  return icons[catId] || '📌';
}

function renderArchive(){
  if(archiveIndex.length===0){
    return `<div class="card"><h2>الأرشيف</h2><div class="empty">لسه معندكش شهور مؤرشفة.<br>لما تخلّص الشهر اضغط أيقونة الأرشيف فوق لحفظه هنا.</div></div>`;
  }
  const items = [...archiveIndex].reverse().map(m=>`
    <div class="archiveitem" data-archive="${m.key}">
      <div class="top"><b>${m.label}</b><span style="font-size:13px;font-weight:800;color:var(--red)">-${fmt(m.totalExpenses)}</span></div>
      <div class="stats">
        <span>المرتب: ${fmt(m.salary)}</span>
        <span>المتبقي: ${fmt(m.salary - m.totalExpenses)}</span>
      </div>
    </div>
  `).join('');
  return `<div class="card"><h2>الشهور المؤرشفة</h2>${items}</div>`;
}

function renderSettings(){
  const accRows = state.accounts.map(a=>`
    <div class="catrow">
      <div class="catname">${a.name}</div>
      <div style="font-size:13px;font-weight:700;color:var(--muted);margin-left:10px;">الرصيد: ${fmt(a.initialBalance || 0)} ج.م</div>
      ${state.accounts.length>1?`<button class="txdel" data-delacc="${a.id}">✕</button>`:''}
    </div>`).join('');

  const catRows = state.categories.map(c=>`
    <div class="catrow"><div class="dot" style="background:${c.color}"></div><div class="catname">${c.name}</div>
    ${!DEFAULT_CATEGORIES.find(d=>d.id===c.id)?`<button class="txdel" data-delcat="${c.id}">✕</button>`:''}
    </div>`).join('');

  return `
    <div class="card">
      <h2>المرتب الشهري</h2>
      <div class="field">
        <label>المرتب (ج.م)</label>
        <input type="number" id="salaryInput" value="${state.salary}" inputmode="decimal">
      </div>
      <button class="btn" id="btnSaveSalary">حفظ المرتب</button>
    </div>

    <div class="card">
      <h2>الحسابات وأرصدتها</h2>
      ${accRows}
      <button class="btn ghost" id="btnAddAcc" style="margin-top:10px;">+ إضافة حساب جديد ورصيده</button>
    </div>

    <div class="card">
      <h2>الفئات</h2>
      ${catRows}
      <button class="btn ghost" id="btnAddCat" style="margin-top:10px;">+ إضافة فئة جديدة</button>
    </div>
  `;
}

function openSheet(html){
  document.getElementById('sheetContent').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
}

function openAddExpenseSheet(){
  const catChips = state.categories.map(c=>`<button class="chip" data-cat="${c.id}" data-catname="${c.name}">${c.name}</button>`).join('');
  const accChips = state.accounts.map(a=>`<button class="chip" data-acc="${a.id}" data-accname="${a.name}">${a.name}</button>`).join('');
  openSheet(`
    <h3>إضافة عملية</h3>
    <div class="rowline" style="margin-bottom:16px;">
      <button class="chip typechip sel" data-type="expense">مصروف</button>
      <button class="chip typechip" data-type="income">دخل إضافي</button>
    </div>
    <div class="field">
      <label>المبلغ (ج.م)</label>
      <input type="number" id="amtInput" placeholder="0" inputmode="decimal">
    </div>
    <div class="field" id="catField">
      <label>الفئة</label>
      <div class="chipwrap">${catChips}</div>
    </div>
    <div class="field">
      <label>من حساب</label>
      <div class="chipwrap">${accChips}</div>
    </div>
    <div class="field">
      <label>وصف (اختياري)</label>
      <input type="text" id="noteInput" placeholder="مثال: مشتريات البقالة">
    </div>
    <button class="btn" id="btnSaveExpense">حفظ العملية</button>
    <div class="smalllink" id="btnCancelSheet">إلغاء</div>
  `);

  let selType = 'expense';
  let selCat = state.categories[0]?.id, selCatName = state.categories[0]?.name;
  let selAcc = state.accounts[0]?.id, selAccName = state.accounts[0]?.name;

  document.querySelectorAll('.typechip').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.typechip').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    selType = b.dataset.type;
    document.getElementById('catField').style.display = selType==='income' ? 'none' : 'block';
  }));
  document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('[data-cat]').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    selCat = b.dataset.cat; selCatName = b.dataset.catname;
  }));
  document.querySelectorAll('[data-acc]').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('[data-acc]').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    selAcc = b.dataset.acc; selAccName = b.dataset.accname;
  }));
  document.querySelector('[data-cat]')?.classList.add('sel');
  document.querySelector('[data-acc]')?.classList.add('sel');

  document.getElementById('btnCancelSheet').addEventListener('click', closeSheet);
  document.getElementById('btnSaveExpense').addEventListener('click', async ()=>{
    const amt = parseFloat(document.getElementById('amtInput').value);
    if(!amt || amt<=0){ showToast('اكتب مبلغ صحيح'); return; }
    const note = document.getElementById('noteInput').value.trim();
    const entry = {
      id: uid(),
      type: selType,
      category: selType==='expense' ? selCat : null,
      categoryName: selType==='expense' ? selCatName : 'دخل إضافي',
      account: selAcc, accountName: selAccName,
      amount: amt, note, date: new Date().toISOString().slice(0,10),
    };

    try {
      const { addDoc, collection } = await import("https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js");
      const docRef = await addDoc(collection(window.db, "users", currentUser.uid, "expenses"), entry);
      state.expenses.push({ firestoreId: docRef.id, ...entry });
      closeSheet();
      render();
      showToast('تم حفظ العملية');
    } catch(e) {
      showToast('خطأ في الحفظ');
    }
  });
}

function openAddAccountSheet(){
  openSheet(`
    <h3>إضافة حساب جديد ورصيده</h3>
    <div class="field"><label>اسم الحساب</label><input type="text" id="accNameInput" placeholder="مثال: البنك الأهلي / كارت محفظة"></div>
    <div class="field"><label>المبلغ أو الرصيد الموجود فيه (ج.م)</label><input type="number" id="accBalanceInput" placeholder="0" inputmode="decimal"></div>
    <button class="btn" id="btnSaveAcc">حفظ الحساب</button>
    <div class="smalllink" id="btnCancelSheet">إلغاء</div>
  `);
  document.getElementById('btnCancelSheet').addEventListener('click', closeSheet);
  document.getElementById('btnSaveAcc').addEventListener('click', async ()=>{
    const name = document.getElementById('accNameInput').value.trim();
    const balance = parseFloat(document.getElementById('accBalanceInput').value) || 0;
    if(!name){ showToast('اكتب اسم الحساب'); return; }
    state.accounts.push({id: uid(), name, initialBalance: balance});
    await saveAccountsToFirebase();
    closeSheet(); render(); showToast('تم إضافة الحساب بنجاح');
  });
}

function openAddCategorySheet(){
  const palette = ['#D98BB0','#7CA6D9','#7FC9A6','#C4633D','#8E7CD9','#E8A93C','#4FA8A0','#1D4A3C','#9A8C6E','#3D8AC4'];
  const color = palette[Math.floor(Math.random()*palette.length)];
  openSheet(`
    <h3>فئة جديدة</h3>
    <div class="field"><label>اسم الفئة</label><input type="text" id="catNameInput" placeholder="مثال: هدايا"></div>
    <button class="btn" id="btnSaveCat">إضافة</button>
    <div class="smalllink" id="btnCancelSheet">إلغاء</div>
  `);
  document.getElementById('btnCancelSheet').addEventListener('click', closeSheet);
  document.getElementById('btnSaveCat').addEventListener('click', async ()=>{
    const name = document.getElementById('catNameInput').value.trim();
    if(!name){ showToast('اكتب اسم الفئة'); return; }
    state.categories.push({id: uid(), name, color});
    await saveCategoriesToFirebase();
    closeSheet(); render(); showToast('تم إضافة الفئة');
  });
}

function openEndMonthSheet(){
  const used = totalExpenses();
  openSheet(`
    <h3>إنهاء الشهر وأرشفته</h3>
    <div class="field" style="background:var(--card-warm);padding:14px;border-radius:14px;font-size:13px;line-height:1.9;">
      هيتم حفظ "${state.monthLabel}" في الأرشيف بإجمالي مصروف ${fmt(used)} ج.م، وهيتصفّر العمليات عشان تبدأ شهر جديد. مرتبك الحالي (${fmt(state.salary)}) هيفضل زي ما هو.
    </div>
    <button class="btn" id="btnConfirmEnd">تأكيد الأرشفة وبدء شهر جديد</button>
    <div class="smalllink" id="btnCancelSheet">إلغاء</div>
  `);
  document.getElementById('btnCancelSheet').addEventListener('click', closeSheet);
  document.getElementById('btnConfirmEnd').addEventListener('click', async ()=>{
    const key = uid();
    const archived = {
      key, label: state.monthLabel, salary: state.salary,
      totalExpenses: totalExpenses(), totalIncomeExtra: totalIncomeExtra(),
      expenses: state.expenses, categoryTotals: categoryTotals(),
    };
    
    try{
      const { setDoc, deleteDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js");
      await setDoc(doc(window.db, "users", currentUser.uid, "archives", key), archived);
      
      const archItem = {key, label: state.monthLabel, salary: state.salary, totalExpenses: totalExpenses()};
      await setDoc(doc(window.db, "users", currentUser.uid, "archiveIndex", key), archItem);
      archiveIndex.push(archItem);

      for(const e of state.expenses){
        if(e.firestoreId){
          await deleteDoc(doc(window.db, "users", currentUser.uid, "expenses", e.firestoreId));
        }
      }
    }catch(e){console.error(e);}

    state.expenses = [];
    state.monthLabel = currentMonthLabel();
    closeSheet();
    activeTab = 'home';
    render();
    showToast('تم أرشفة الشهر وبدء شهر جديد 🎉');
  });
}

async function openArchiveDetail(key){
  let data = null;
  try{
    const { getDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js");
    const snap = await getDoc(doc(window.db, "users", currentUser.uid, "archives", key));
    if(snap.exists()) data = snap.data();
  }catch(e){}
  if(!data){ showToast('تعذر تحميل بيانات الشهر'); return; }
  const cats = (data.categoryTotals||[]).map(c=>`
    <div class="catrow"><div class="dot" style="background:${c.color}"></div><div class="catname">${c.name}</div>
    <div class="catamt">${fmt(c.amount)}</div></div>`).join('') || `<div class="empty">مفيش مصروفات مسجّلة.</div>`;
  openSheet(`
    <h3>${data.label}</h3>
    <div class="rowline" style="margin-bottom:16px;">
      <div class="card" style="margin:0;padding:14px;"><div class="catmini">المرتب</div><div style="font-weight:800;font-size:16px;">${fmt(data.salary)}</div></div>
      <div class="card" style="margin:0;padding:14px;"><div class="catmini">المصروف</div><div style="font-weight:800;font-size:16px;color:var(--red);">${fmt(data.totalExpenses)}</div></div>
    </div>
    <h3 style="font-size:14px;">تفاصيل الفئات</h3>
    ${cats}
    <div class="smalllink" id="btnCancelSheet">إغلاق</div>
  `);
  document.getElementById('btnCancelSheet').addEventListener('click', closeSheet);
}

function attachHomeEvents(){
  const endBtn = document.getElementById('btnEndMonth');
  if(endBtn) endBtn.addEventListener('click', openEndMonthSheet);

  const logoutBtn = document.getElementById('btnLogout');
  if(logoutBtn) logoutBtn.addEventListener('click', async () => {
    await window.signOut(window.auth);
    showToast('تم تسجيل الخروج');
  });

  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', async ()=>{
    const id = b.dataset.del;
    try {
      const { deleteDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js");
      await deleteDoc(doc(window.db, "users", currentUser.uid, "expenses", id));
      state.expenses = state.expenses.filter(e=>e.firestoreId!==id && e.id!==id);
      render();
      showToast('تم الحذف');
    } catch(e) {
      showToast('تعذر الحذف');
    }
  }));

  document.querySelectorAll('[data-archive]').forEach(el=>el.addEventListener('click', ()=>{
    openArchiveDetail(el.dataset.archive);
  }));

  document.querySelectorAll('[data-delacc]').forEach(b=>b.addEventListener('click', async ()=>{
    state.accounts = state.accounts.filter(a=>a.id!==b.dataset.delacc);
    await saveAccountsToFirebase();
    render();
    showToast('تم الحذف');
  }));

  document.querySelectorAll('[data-delcat]').forEach(b=>b.addEventListener('click', async ()=>{
    state.categories = state.categories.filter(c=>c.id!==b.dataset.delcat);
    await saveCategoriesToFirebase();
    render();
    showToast('تم الحذف');
  }));

  const btnSaveSalary = document.getElementById('btnSaveSalary');
  if(btnSaveSalary) btnSaveSalary.addEventListener('click', async ()=>{
    const v = parseFloat(document.getElementById('salaryInput').value) || 0;
    state.salary = v;
    try {
      const { setDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.x.x/firebase-firestore.js");
      await setDoc(doc(window.db, "users", currentUser.uid, "settings", "salary"), { value: v });
      render();
      showToast('تم حفظ المرتب');
    } catch(e) {
      showToast('خطأ في الحفظ');
    }
  });

  const btnAddAcc = document.getElementById('btnAddAcc');
  if(btnAddAcc) btnAddAcc.addEventListener('click', openAddAccountSheet);
  const btnAddCat = document.getElementById('btnAddCat');
  if(btnAddCat) btnAddCat.addEventListener('click', openAddCategorySheet);
}

document.getElementById('fabAdd').addEventListener('click', openAddExpenseSheet);
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeSheet(); });
document.getElementById('tabbar').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  activeTab = btn.dataset.tab;
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
});
</script>
</body>
</html>
